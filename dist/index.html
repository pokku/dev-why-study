<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#101d38" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="./icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta
      name="description"
      content="学校で習うことが、学問・技術・仕事・身近なものへどうつながるかをたどる知識マップ。"
    />
    <title>どうして勉強しないといけないの？</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="site-header">
      <button class="brand" type="button" data-go-home aria-label="トップへ戻る">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <span>どうして勉強しないといけないの？</span>
      </button>
      <div class="header-search">
        <label class="sr-only" for="global-search">知識を検索</label>
        <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="m16 16 4 4"></path></svg>
        <input id="global-search" type="search" placeholder="AI、割合、野球…" autocomplete="off" />
        <div id="search-results" class="search-results" hidden></div>
      </div>
    </header>

    <main id="app" tabindex="-1">
      <div class="loading-state" role="status">
        <span class="loading-orbit" aria-hidden="true"></span>
        知識のつながりを読み込んでいます
      </div>
    </main>

    <footer>
      <p>知識のつながりを、ひとつずつ。<span id="data-count"></span></p>
    </footer>

    <template id="home-template">
      <section class="map-stage" aria-labelledby="map-title">
        <div class="map-stage-heading">
          <div>
            <p class="eyebrow">KNOWLEDGE MAP</p>
            <h1 id="map-title">勉強の先を、<em>地図で眺める。</em></h1>
          </div>
          <p>学校で習うことから、技術や好きなものまで。代表的な3本の道筋を、つながる理由と一緒に並べました。</p>
        </div>
        <div class="map-legend" aria-label="ノードの種類">
          <span data-kind="school">学校</span><span data-kind="academic">学問</span><span data-kind="technology">技術</span><span data-kind="interest">興味</span>
        </div>
        <div class="overview-maps" id="overview-maps"></div>
      </section>

      <section class="path-tool-section">
        <div class="route-finder" aria-labelledby="route-title">
          <div class="route-heading">
            <span class="route-icon" aria-hidden="true">↗</span>
            <div><p class="micro-label">PATH FINDER</p><h2 id="route-title">2つの知識をつないでみる</h2></div>
          </div>
          <div class="route-controls">
            <label>出発点<select id="path-from"></select></label>
            <span class="route-arrow" aria-hidden="true">→</span>
            <label>行き先<select id="path-to"></select></label>
          </div>
          <button class="primary-button" id="find-path" type="button">道筋を探す</button>
          <div id="path-result" class="path-result" aria-live="polite"></div>
        </div>
      </section>

      <section class="entry-section" aria-labelledby="entry-title">
        <div class="section-heading">
          <div><p class="micro-label">START ANYWHERE</p><h2 id="entry-title">どこから見てみる？</h2></div>
          <p>入口は違っても、知識は同じ地図の上でつながっています。</p>
        </div>
        <div class="entry-grid" id="entry-grid"></div>
      </section>

      <section class="browse-section" id="browse-section" aria-labelledby="browse-title">
        <div class="browse-heading">
          <div><p class="micro-label">EXPLORE</p><h2 id="browse-title">知識を見渡す</h2></div>
          <div class="filter-row" id="filter-row" role="group" aria-label="知識の絞り込み"></div>
        </div>
        <div id="node-grid" class="node-grid"></div>
      </section>
    </template>
    <script type="module" src="./app.js"></script>
  </body>
</html>
