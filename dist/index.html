<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#101d38" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="./icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta
      name="description"
      content="学校で習うことが、学問・技術・仕事・身近なものへどうつながるかをたどる知識マップ。"
    />
    <title>どうして勉強しないといけないの？</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="site-header">
      <button class="brand" type="button" data-go-home aria-label="トップへ戻る">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <span>どうして勉強しないといけないの？</span>
      </button>
      <div class="header-search">
        <label class="sr-only" for="global-search">知識を検索</label>
        <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="m16 16 4 4"></path></svg>
        <input id="global-search" type="search" placeholder="AI、割合、野球…" autocomplete="off" />
        <div id="search-results" class="search-results" hidden></div>
      </div>
    </header>

    <main id="app" tabindex="-1">
      <div class="loading-state" role="status">
        <span class="loading-orbit" aria-hidden="true"></span>
        知識のつながりを読み込んでいます
      </div>
    </main>

    <footer>
      <p>知識のつながりを、ひとつずつ。<span id="data-count"></span></p>
    </footer>

    <template id="home-template">
      <section class="entry-section" aria-labelledby="entry-title">
        <div class="section-heading">
          <div><p class="micro-label">CHOOSE AN ENTRANCE</p><h1 id="entry-title">どこから見てみる？</h1></div>
          <p>入口を選び、段階を追ってテーマまで進むと、そこから知識の地図が広がります。</p>
        </div>
        <div class="entry-grid" id="entry-grid"></div>
      </section>

      <section class="explorer-section" id="explorer-section" aria-labelledby="explorer-title" hidden>
        <div class="explorer-shell">
          <nav class="explorer-breadcrumbs" id="explorer-breadcrumbs" aria-label="選択した道筋"></nav>
          <div class="explorer-heading">
            <div><p class="micro-label">FOLLOW THE CURRICULUM</p><h2 id="explorer-title">段階を選ぶ</h2></div>
            <p id="explorer-guide"></p>
          </div>
          <div class="explorer-options" id="explorer-options"></div>
        </div>
      </section>
    </template>
    <script type="module" src="./app.js"></script>
  </body>
</html>
